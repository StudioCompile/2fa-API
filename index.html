<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2FA Code</title>
</head>
<body>
<pre id="code"></pre>

<script>
// Usage: yourpage.html?Secret=BASE32SECRET
// Everything below runs synchronously (no Promises), so the code
// is written to the page in one pass, with nothing async to wait on.

function rotl(n, s) { return (n << s) | (n >>> (32 - s)); }

function concatBytes(a, b) {
  const out = new Uint8Array(a.length + b.length);
  out.set(a, 0);
  out.set(b, a.length);
  return out;
}

function sha1(bytes) {
  const H = [0x67452301, 0xEFCDAB89, 0x98BADCFE, 0x10325476, 0xC3D2E1F0];
  const ml = bytes.length * 8;
  const withPad = Array.from(bytes);
  withPad.push(0x80);
  while (withPad.length % 64 !== 56) withPad.push(0);
  for (let i = 0; i < 4; i++) withPad.push(0);
  withPad.push((ml >>> 24) & 0xff, (ml >>> 16) & 0xff, (ml >>> 8) & 0xff, ml & 0xff);

  for (let chunkStart = 0; chunkStart < withPad.length; chunkStart += 64) {
    const w = new Array(80);
    for (let i = 0; i < 16; i++) {
      w[i] = ((withPad[chunkStart + i * 4] << 24) |
              (withPad[chunkStart + i * 4 + 1] << 16) |
              (withPad[chunkStart + i * 4 + 2] << 8) |
              (withPad[chunkStart + i * 4 + 3])) | 0;
    }
    for (let i = 16; i < 80; i++) {
      w[i] = rotl(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1);
    }
    let [a, b, c, d, e] = H;
    for (let i = 0; i < 80; i++) {
      let f, k;
      if (i < 20) { f = (b & c) | (~b & d); k = 0x5A827999; }
      else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const temp = (rotl(a, 5) + f + e + k + w[i]) | 0;
      e = d; d = c; c = rotl(b, 30); b = a; a = temp;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0;
    H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0;
  }

  const out = new Uint8Array(20);
  for (let i = 0; i < 5; i++) {
    out[i * 4] = (H[i] >>> 24) & 0xff;
    out[i * 4 + 1] = (H[i] >>> 16) & 0xff;
    out[i * 4 + 2] = (H[i] >>> 8) & 0xff;
    out[i * 4 + 3] = H[i] & 0xff;
  }
  return out;
}

function hmacSha1(keyBytes, msgBytes) {
  const blockSize = 64;
  let key = keyBytes;
  if (key.length > blockSize) key = sha1(key);
  if (key.length < blockSize) {
    const padded = new Uint8Array(blockSize);
    padded.set(key);
    key = padded;
  }
  const oKeyPad = new Uint8Array(blockSize);
  const iKeyPad = new Uint8Array(blockSize);
  for (let i = 0; i < blockSize; i++) {
    oKeyPad[i] = key[i] ^ 0x5c;
    iKeyPad[i] = key[i] ^ 0x36;
  }
  const inner = sha1(concatBytes(iKeyPad, msgBytes));
  return sha1(concatBytes(oKeyPad, inner));
}

function base32Decode(input) {
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  const clean = input.toUpperCase().replace(/[^A-Z2-7]/g, "");
  let bits = "";
  for (const char of clean) {
    bits += alphabet.indexOf(char).toString(2).padStart(5, "0");
  }
  const bytes = [];
  for (let i = 0; i + 8 <= bits.length; i += 8) {
    bytes.push(parseInt(bits.substring(i, i + 8), 2));
  }
  return new Uint8Array(bytes);
}

function totpForCounter(counter, keyBytes, digits) {
  const counterBytes = new Uint8Array(8);
  let c = counter;
  for (let i = 7; i >= 0; i--) {
    counterBytes[i] = c & 0xff;
    c = Math.floor(c / 256);
  }
  const hmac = hmacSha1(keyBytes, counterBytes);
  const offset = hmac[hmac.length - 1] & 0x0f;
  const code = (
    ((hmac[offset] & 0x7f) << 24) |
    ((hmac[offset + 1] & 0xff) << 16) |
    ((hmac[offset + 2] & 0xff) << 8) |
    (hmac[offset + 3] & 0xff)
  ) % (10 ** digits);
  return code.toString().padStart(digits, "0");
}

// --- main, synchronous ---
const params = new URLSearchParams(window.location.search);
const secret = params.get("Secret") || params.get("secret") || "";
const digits = parseInt(params.get("Digits") || params.get("digits") || "6");
const period = parseInt(params.get("Period") || params.get("period") || "30");

const codeEl = document.getElementById("code");

if (!secret) {
  codeEl.textContent = "Missing Secret param";
} else {
  const keyBytes = base32Decode(secret);
  const periodMs = period * 1000;
  const msIntoPeriod = Date.now() % periodMs;
  const remainingMs = periodMs - msIntoPeriod;
  const counter = Math.floor(Date.now() / periodMs);

  if (remainingMs <= 2500) {
    codeEl.textContent = "~" + totpForCounter(counter + 1, keyBytes, digits);
  } else {
    codeEl.textContent = totpForCounter(counter, keyBytes, digits);
  }
}
</script>
</body>
</html>
